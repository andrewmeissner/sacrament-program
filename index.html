<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sacrament Meeting Program</title>

  <!-- Material Design Lite -->
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <style>
    body {
      background: #f5f5f5;
    }
    .page-content {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .mdl-card {
      width: 100%;
      margin-bottom: 20px;
    }
    .mdl-card__title {
      padding: 16px;
    }
    .mdl-card__supporting-text {
      padding: 16px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body class="mdl-color--grey-100 mdl-typography--body-1">

  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header mdl-color--indigo-500 mdl-color-text--white">
      <div class="mdl-layout__header-row">
        <span class="mdl-layout-title">Sacrament Meeting Program</span>
      </div>
    </header>

    <main class="mdl-layout__content">
      <div class="page-content" id="program-container">
        <!-- Cards will be injected here -->
      </div>
    </main>
  </div>

  <script>
    // UPDATE THIS URL to your GitHub Pages JSON file
    const jsonUrl = "https://andrewmeissner.github.io/sacrament-program/data/program.json";

    // Prevent crashes if JSON fields are missing or not arrays
    function safeList(arr) {
      return Array.isArray(arr) ? arr.join("<br>") : "";
    }

    function card(title, content) {
      return `
        <div class="mdl-card mdl-shadow--2dp">
          <div class="mdl-card__title mdl-color--indigo-500 mdl-color-text--white">
            <h2 class="mdl-card__title-text">${title}</h2>
          </div>
          <div class="mdl-card__supporting-text">
            ${content}
          </div>
        </div>
      `;
    }

    fetch(jsonUrl)
      .then(response => response.json())
      .then(data => {

        document.getElementById("program-container").innerHTML = `
          ${card("Date", data.MeetingDate)}

          ${card("Presiding & Conducting", `
            <strong>Presiding:</strong> ${data.Presiding}<br>
            <strong>Conducting:</strong> ${data.Conducting}<br>
            <strong>Chorister:</strong> ${data.Chorister}<br>
            <strong>Organist:</strong> ${data.Organist}<br>
            <strong>Invocation:</strong> ${data.Invocation}<br>
            <strong>Benediction:</strong> ${data.Benediction}
          `)}

          ${card("Hymns", `
            <strong>Opening Hymn:</strong> ${data.OpeningHymn}<br>
            <strong>Sacrament Hymn:</strong> ${data.SacramentHymn}<br>
            <strong>Intermediate Hymn:</strong> ${data.IntermediateHymn}<br>
            <strong>Special Musical Number:</strong> ${data.SpecialMusicalNumber}<br>
            <strong>Closing Hymn:</strong> ${data.ClosingHymn}
          `)}

          ${card("Speakers", safeList(data.Speakers))}
          ${card("Announcements", safeList(data.Announcements))}
          ${card("Releasings", safeList(data.Releasings))}
          ${card("Sustainings", safeList(data.Sustainings))}
          ${card("New Members", safeList(data.NewMembers))}
          ${card("Naming & Blessing Children", safeList(data.NamingAndBlessingChildren))}
          ${card("Aaronic Priesthood Ordinations", safeList(data.AaronicPriesthoodOrdinations))}
          ${card("Confirmations", safeList(data.Confirmations))}
        `;
      })
      .catch(err => {
        document.getElementById("program-container").innerHTML =
          card("Error", "Unable to load program data.<br><br>" + err);
      });
  </script>

</body>
</html>
