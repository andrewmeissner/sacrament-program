<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sacrament Meeting Program</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .section-card {
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sacrament Meeting Program</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" id="program-container">
        <!-- Cards will be injected here -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // UPDATE THIS URL to your GitHub Pages JSON file
        const jsonUrl = "https://andrewmeissner.github.io/sacrament-program/data/program.json";

        function card(title, content) {
            return `
        <div class="card shadow-sm section-card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">${title}</h5>
          </div>
          <div class="card-body">
            ${content}
          </div>
        </div>
      `;
        }

        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {

                document.getElementById("program-container").innerHTML = `
          ${card("Date", data.MeetingDate)}

          ${card("Presiding & Conducting", `
            <strong>Presiding:</strong> ${data.Presiding}<br>
            <strong>Conducting:</strong> ${data.Conducting}<br>
            <strong>Chorister:</strong> ${data.Chorister}<br>
            <strong>Organist:</strong> ${data.Organist}<br>
            <strong>Invocation:</strong> ${data.Invocation}<br>
            <strong>Benediction:</strong> ${data.Benediction}
          `)}

          ${card("Hymns", `
            <strong>Opening Hymn:</strong> ${data.OpeningHymn}<br>
            <strong>Sacrament Hymn:</strong> ${data.SacramentHymn}<br>
            <strong>Intermediate Hymn:</strong> ${data.IntermediateHymn}<br>
            <strong>Special Musical Number:</strong> ${data.SpecialMusicalNumber}<br>
            <strong>Closing Hymn:</strong> ${data.ClosingHymn}
          `)}

          ${card("Speakers", data.Speakers.join("<br>"))}

          ${card("Announcements", data.Announcements.join("<br>"))}

          ${card("Releasings", data.Releasings.join("<br>"))}

          ${card("Sustainings", data.Sustainings.join("<br>"))}

          ${card("New Members", data.NewMembers.join("<br>"))}

          ${card("Naming & Blessing Children", data.NamingAndBlessingChildren.join("<br>"))}

          ${card("Aaronic Priesthood Ordinations", data.AaronicPriesthoodOrdinations.join("<br>"))}

          ${card("Confirmations", data.Confirmations.join("<br>"))}
        `;
            })
            .catch(err => {
                document.getElementById("program-container").innerHTML =
                    card("Error", "Unable to load program data.<br><br>" + err);
            });
    </script>

</body>

</html>
